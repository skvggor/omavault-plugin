[package]
name = "omavault-helper"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "gocryptfs vault helper for the Omarchy Protected Files plugin"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
