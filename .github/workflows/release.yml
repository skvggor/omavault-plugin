name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required by actions/attest-build-provenance to mint an OIDC token
  # for signing the build provenance against Sigstore.
  id-token: write
  # Required by actions/attest-build-provenance to persist the attestation
  # through the repository attestations API.
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs so mutable tags cannot silently change what
      # builds the released artifact.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify versions match tag
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$manifest_version" || "$tag_version" != "$cargo_version" ]]; then
            echo "version mismatch: tag v$tag_version, manifest.json $manifest_version, Cargo.toml $cargo_version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test

      - name: Build static helper
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Stage release assets
        run: |
          asset="omavault-helper-x86_64-linux-musl"
          cd target/x86_64-unknown-linux-musl/release
          cp omavault-helper "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: target/x86_64-unknown-linux-musl/release/omavault-helper-x86_64-linux-musl

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/x86_64-unknown-linux-musl/release/omavault-helper-x86_64-linux-musl \
            target/x86_64-unknown-linux-musl/release/omavault-helper-x86_64-linux-musl.sha256
